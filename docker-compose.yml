version: "3.9"

services:
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: front-end
    ports:
      - "3070:3000" 
    depends_on:
      - backend
    volumes:
      #- ./front-end:/app
      - ./front-end/.env:/app/.env


  backend:
    build:
      context: . 
    container_name: r-plumber
    volumes:
      - ./:/app
      - ./api.R:/app/api.R 
    ports:
      - "3071:8000" 
    mem_limit: 1g # Limit memory usage for the backend
    
